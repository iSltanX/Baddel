<!doctype html>
<html><head><meta charset="utf-8"><title>baddel-test</title>
<style>body{font:16px -apple-system;padding:20px} textarea,input,div[contenteditable]{display:block;width:500px;margin:10px 0;font-size:16px} div[contenteditable]{border:1px solid #999;min-height:40px;padding:4px}</style>
</head><body>
<textarea id="ta" rows="3"></textarea>
<div id="ce" contenteditable="true"></div>
<input id="pw" type="password">
<script>
// A reused tab gets only a hash change, no load: refocus on both. Safari focuses a
// contenteditable without a caret (⌘A then selects the page), so place one.
const focus = () => {
  const el = document.getElementById(location.hash.slice(1) || 'ta');
  el.focus();
  if (el.isContentEditable) getSelection().setBaseAndExtent(el, 0, el, 0);
};
window.addEventListener('load', focus);
window.addEventListener('hashchange', focus);
</script>
</body></html>
