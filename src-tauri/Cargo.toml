[package]
name = "baddel"
description = "Baddel — fix text typed in the wrong keyboard layout."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "baddel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
baddel-core = { path = "../crates/baddel-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Linked now, registered in phase 5: the plugin refuses to start without a signing pubkey.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSURL",
    "NSGeometry",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "NSRunningApplication",
    # App icons for the exceptions list.
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    # The native conversion notice (src/hud.rs).
    "NSAccessibility",
    "NSAppearance",
    # Giving back the launch activation (src/sys/chrome.rs).
    "NSApplication",
    "NSBezierPath",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSImageView",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSSound",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
