[workspace]
members = ["crates/baddel-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sultan Al-Anzi"]
repository = "https://github.com/iSltanX/Baddel"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
