[workspace]
members = ["crates/baddel-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Sultan Al-Anzi"]
repository = "https://github.com/iSltanX/Baddel"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macros and build scripts are dylibs/executables the compiler loads. Stripped by the
# macOS 27 toolchain they fail to load ("mis-aligned LINKEDIT string pool"), so strip only
# what ships.
[profile.release.build-override]
strip = false
